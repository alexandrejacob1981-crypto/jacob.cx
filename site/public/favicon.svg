<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="jacob.cx">
  <!--
    Favicone jacob.cx. Un « j » ambre sur graphite, aux couleurs de la
    direction « Relevé » : --ground #0b0f12 et --accent #e3a93c.
    Tracé en chemins plutôt qu'en <text> : une favicone ne peut pas
    compter sur la présence d'une police.
  -->
  <rect width="64" height="64" rx="13" fill="#0b0f12"/>
  <circle cx="37" cy="15.5" r="5" fill="#e3a93c"/>
  <path d="M37 27v15c0 7.5-6.5 10.5-13 7.5"
        fill="none" stroke="#e3a93c" stroke-width="8.5" stroke-linecap="round"/>
</svg>
